<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-label="Every office reaches every other over two ISPs, with no hub to fail" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .bg { fill: #ffffff; }
    .ink { fill: #1f2328; }
    .quiet { fill: #59636e; }
    .edge { stroke: #8c959f; }
    .box { fill: none; stroke: #8c959f; stroke-width: 1.25; }
    .hub { fill: #2f6fdb; fill-opacity: .12; stroke: #2f6fdb; stroke-width: 2; }
    .cloud { fill: #f1f3f5; stroke: #8c959f; stroke-width: 1.25; }
    .tun { stroke: #2f6fdb; stroke-width: 2.5; fill: none; }
    .dash { stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 4 4; fill: none; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .ink { fill: #e6edf3; }
      .quiet { fill: #9198a1; }
      .box, .cloud, .dash { stroke: #6e7681; }
      .cloud { fill: #161b22; }
      .hub { fill: #4c8dff; stroke: #4c8dff; fill-opacity: .16; }
      .tun { stroke: #4c8dff; }
    }
  </style>
  <rect class="bg" width="760" height="560" rx="12"/>
  <text class="ink" x="24" y="34" font-size="16" font-weight="600">Every office reaches every other over two ISPs, with no hub to fail</text>

  <rect class="cloud" x="24" y="52" width="712" height="44" rx="8"/>
  <text class="ink" x="380" y="79" text-anchor="middle">Fortinet cloud: FortiManager · FortiAnalyzer · FortiClient EMS · FortiIdentity</text>
  <path class="dash" d="M380 96V136M150 96V330M610 96V330"/>
  <text class="quiet" x="618" y="246" font-size="11.5">outbound config,</text>
  <text class="quiet" x="618" y="262" font-size="11.5">logs and MFA</text>

  <path class="tun" d="M300 224L190 330M460 224L570 330M276 374H484"/>
  <text class="ink" x="256" y="292" font-size="11.5">4 IPsec tunnels</text>
  <text class="ink" x="504" y="292" font-size="11.5" text-anchor="end">4 IPsec tunnels</text>
  <text class="ink" x="380" y="364" font-size="11.5" text-anchor="middle">4 IPsec tunnels</text>
  <text class="quiet" x="380" y="326" font-size="11.5" text-anchor="middle">iBGP + SD-WAN SLA steering</text>

  <rect class="hub" x="250" y="136" width="260" height="88" rx="8"/>
  <text class="ink" x="380" y="160" text-anchor="middle" font-weight="600">Beirut · 70 people</text>
  <text class="ink" x="380" y="178" text-anchor="middle" font-size="11.5">2 × FG-90G HA · Fabric root</text>
  <text class="quiet" x="380" y="194" text-anchor="middle" font-size="11.5">ISP1 500 + ISP2 200 Mbps</text>
  <text class="quiet" x="380" y="210" text-anchor="middle" font-size="11.5">10.20.0.0/16</text>

  <rect class="box" x="24" y="330" width="252" height="88" rx="8"/>
  <text class="ink" x="150" y="354" text-anchor="middle" font-weight="600">London · 30 people</text>
  <text class="ink" x="150" y="372" text-anchor="middle" font-size="11.5">1 × FG-70G</text>
  <text class="quiet" x="150" y="388" text-anchor="middle" font-size="11.5">ISP1 1000 + ISP2 300 Mbps</text>
  <text class="quiet" x="150" y="404" text-anchor="middle" font-size="11.5">10.10.0.0/16</text>

  <rect class="box" x="484" y="330" width="252" height="88" rx="8"/>
  <text class="ink" x="610" y="354" text-anchor="middle" font-weight="600">Dubai · 40 people</text>
  <text class="ink" x="610" y="372" text-anchor="middle" font-size="11.5">1 × FG-90G</text>
  <text class="quiet" x="610" y="388" text-anchor="middle" font-size="11.5">ISP1 1000 + ISP2 500 Mbps</text>
  <text class="quiet" x="610" y="404" text-anchor="middle" font-size="11.5">10.30.0.0/16</text>

  <path class="dash" d="M150 418V498H210M610 418V498H550"/>
  <text class="quiet" x="158" y="450" font-size="11.5">VPN to home office</text>
  <text class="quiet" x="602" y="450" font-size="11.5" text-anchor="end">any other office as backup</text>
  <rect class="box" x="210" y="462" width="340" height="72" rx="8"/>
  <text class="ink" x="380" y="486" text-anchor="middle" font-weight="600">Home workers</text>
  <text class="ink" x="380" y="504" text-anchor="middle" font-size="11.5">FortiClient IKEv2 · AD password + FortiToken</text>
  <text class="quiet" x="380" y="520" text-anchor="middle" font-size="11.5">EMS-compliant laptops only · split tunnel</text>
</svg>
