# Acme Digital - Beirut (BEY) FortiGate FG-90G A-P HA cluster
# Target FortiOS 7.6.7 - GENERATED from inventory/sites.yaml, do not hand-edit.
# Prerequisites (see design doc 'Deployment runbook'):
#   1. FortiGate registered in FortiCloud, licensed (UTP), firmware upgraded, factory-reset.
#   2. wan1/wan2 removed from the default SD-WAN zone and from any default policy.
#   3. Corporate root CA imported as 'CORP-ROOT-CA' (System > Certificates) for LDAPS.
#   4. Apply via FortiManager CLI script or System > Settings > Configuration scripts.
#
# !!! DEMO SECRETS: every key/password below starts with 'DEMO' and is public.
# !!! Run 'python3 generator/generate.py --real-secrets' before deploying.

# ---- System, admin hardening, DNS, NTP ----
config system global
    set hostname "FGT-BEY-01"
    set admin-sport 8443
    set admin-ssh-port 22
    set admintimeout 15
    set admin-lockout-threshold 3
    set admin-lockout-duration 900
    set strong-crypto enable
    set ssl-min-proto-version TLSv1-2
    set admin-https-redirect enable
    set gui-firmware-upgrade-warning enable
end
config system settings
    set ike-tcp-port 443
    set gui-multiple-interface-policy enable
end
config system dns
    set primary 96.45.45.45
    set secondary 96.45.46.46
    set protocol dot
    set server-hostname "globalsdns.fortinet.net"
end
config system password-policy
    set status enable
    set minimum-length 14
    set min-upper-case-letter 1
    set min-lower-case-letter 1
    set min-number 1
    set min-non-alphanumeric 1
    set expire-status disable
end

