    config zone
        edit "UNDERLAY"
        next
        edit "OVERLAY"
        next
    end
    config members
        edit 1
            set interface "wan1"
            set zone "UNDERLAY"
            set gateway 203.0.113.17
            set priority 1
        next
        edit 2
            set interface "wan2"
            set zone "UNDERLAY"
            set gateway 198.51.100.17
            set priority 10
        next
        edit 101
