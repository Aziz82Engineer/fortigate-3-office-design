# LON: apply AFTER FortiClient EMS is connected and ZTNA tags are synced.
# Blocks VPN for any endpoint that is not EMS-registered and compliant.
config vpn ipsec phase1-interface
    edit "RA-VPN1"
        set remote-gw-match ztna
        set remote-gw-ztna-tags "EMS-ZTNA-Corporate-Compliant"
    next
    edit "RA-VPN2"
        set remote-gw-match ztna
        set remote-gw-ztna-tags "EMS-ZTNA-Corporate-Compliant"
    next
end
