    vpn_pool: "10.30.200.0/24"
    dc_ips: ["10.30.40.10"]
    wan:
      wan1: {isp: "ISP-A (fibre)",   ip: "203.0.113.30/29",  gw: "203.0.113.25",  bw_mbps: 1000}  # CHANGE
      wan2: {isp: "ISP-B (fibre/5G)", ip: "198.51.100.30/29", gw: "198.51.100.25", bw_mbps: 500}   # CHANGE
